name: Add presentation samples

on:
  push:
    paths:
      - '.github/workflows/add-presentation-samples.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown pillow

      - name: Download source DOCX
        id: download
        continue-on-error: true
        run: |
          set -o pipefail
          gdown --id 1WXXrucc0PMM6VKIO2mFH6TpKU2BKx5VH -O /tmp/presentation-samples.docx 2>&1 | tee /tmp/presentation-download.log
          test -s /tmp/presentation-samples.docx

      - name: Record download error if needed
        if: steps.download.outcome != 'success'
        run: |
          {
            echo 'Presentation source download failed.'
            echo
            cat /tmp/presentation-download.log || true
          } > presentation-workflow-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation-workflow-error.txt
          git commit -m 'Record presentation source download error' || exit 0
          git push

      - name: Extract presentation screenshots
        if: steps.download.outcome == 'success'
        run: |
          python <<'PY'
          import os, re, zipfile
          from PIL import Image, ImageOps

          os.makedirs('assets/presentation-samples', exist_ok=True)
          source='/tmp/presentation-samples.docx'
          assert os.path.getsize(source) > 3_000_000, 'Downloaded DOCX is unexpectedly small'

          with zipfile.ZipFile(source) as z:
              media=[]
              for name in z.namelist():
                  if not name.startswith('word/media/image'):
                      continue
                  m=re.search(r'image(\d+)\.', name)
                  if not m:
                      continue
                  data=z.read(name)
                  if len(data) <= 20_000:
                      continue
                  media.append((int(m.group(1)), name, data))
              media.sort(key=lambda x:x[0])
              assert len(media) == 13, f'Expected 13 presentation screenshots, found {len(media)}'

              sample_paths=[]
              for idx, (_, name, data) in enumerate(media, start=1):
                  tmp=f'/tmp/sample-{idx:02d}.png'
                  with open(tmp,'wb') as f:
                      f.write(data)
                  im=Image.open(tmp).convert('RGB')
                  if im.width > 1200:
                      im=im.resize((1200, round(im.height*1200/im.width)), Image.Resampling.LANCZOS)
                  out=f'assets/presentation-samples/presentation-sample-{idx:02d}.jpg'
                  im.save(out,'JPEG',quality=88,optimize=True,progressive=True)
                  sample_paths.append(out)

          chosen=[0,2,6,11]
          canvas=Image.new('RGB',(1200,900),(245,242,235))
          gap=16; pad=20
          cell_w=(1200-2*pad-gap)//2
          cell_h=(900-2*pad-gap)//2
          positions=[(pad,pad),(pad+cell_w+gap,pad),(pad,pad+cell_h+gap),(pad+cell_w+gap,pad+cell_h+gap)]
          for idx,(x,y) in zip(chosen,positions):
              im=Image.open(sample_paths[idx]).convert('RGB')
              tile=ImageOps.fit(im,(cell_w,cell_h),method=Image.Resampling.LANCZOS,centering=(0.5,0.05))
              canvas.paste(tile,(x,y))
          canvas.save('assets/presentation-samples/presentation-samples-cover.jpg','JPEG',quality=90,optimize=True,progressive=True)
          PY

      - name: Add isolated gallery card
        if: steps.download.outcome == 'success'
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('js/projects.js')
          text=p.read_text(encoding='utf-8')
          if 'presentation-samples-collection' not in text:
              anchor='  {id:"nike-marketing-mix",title:"Nike — Integrated Marketing Mix Analysis",section:"presentations",spriteCell:[0,0],galleryCells:[[0,0],[1,0],[2,0],[3,0],[0,1],[1,1]]},\n'
              urls=','.join(f'"assets/presentation-samples/presentation-sample-{i:02d}.jpg?v=20260818-1"' for i in range(1,14))
              addition=('  {id:"presentation-samples-collection",title:"نماذج عروض تقديمية — مختارات",section:"presentations",cover:"assets/presentation-samples/presentation-samples-cover.jpg?v=20260818-1",ctaLabel:"استعراض النماذج",imageUrls:['+urls+']},\n')
              assert anchor in text, 'Nike anchor not found; refusing to modify other sections'
              p.write_text(text.replace(anchor,anchor+addition,1),encoding='utf-8')
          index=Path('index.html')
          html=index.read_text(encoding='utf-8').replace('js/projects.js?v=20260818-testimonial-1','js/projects.js?v=20260818-presentations-1')
          index.write_text(html,encoding='utf-8')
          PY

      - name: Commit presentation additions
        if: steps.download.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/presentation-samples js/projects.js index.html
          git commit -m 'Add presentation sample gallery' || exit 0
          git push

