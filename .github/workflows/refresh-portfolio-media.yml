name: Refresh portfolio media

on:
  push:
    paths:
      - '.github/workflows/refresh-portfolio-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests playwright
          python -m playwright install --with-deps chromium

      - name: Download atlas and capture site covers
        run: |
          python <<'PY'
          import asyncio
          import io
          import os
          import requests
          from PIL import Image
          from playwright.async_api import async_playwright

          os.makedirs('assets', exist_ok=True)

          atlas_id = '1bH6J0MmpYGCYEMnYPe8YOmo-MI1dpu2p'
          atlas_path = 'assets/portfolio-project-atlas-v4.jpg'
          target_ratio = 3200 / 18200
          found = False
          for size in ('w3200', 'w4097', 'w4701', 'w5001'):
              url = f'https://drive.google.com/thumbnail?id={atlas_id}&sz={size}'
              response = requests.get(url, timeout=120)
              response.raise_for_status()
              try:
                  image = Image.open(io.BytesIO(response.content)).convert('RGB')
              except Exception:
                  continue
              ratio = image.width / image.height
              print('Drive thumbnail', size, image.size, ratio)
              if abs(ratio - target_ratio) < 0.006:
                  if image.size != (3200, 18200):
                      image = image.resize((3200, 18200), Image.Resampling.LANCZOS)
                  image.save(atlas_path, 'JPEG', quality=82, optimize=True, progressive=True)
                  found = True
                  break
          if not found:
              raise RuntimeError('Drive thumbnail is still serving the obsolete atlas version.')

          sites = {
              'site-khatt-altamas.jpg': 'https://madardigital.github.io/khatt-altamas/index.html',
              'site-waqie-vision.jpg': 'https://madardigital.github.io/waqie-vision/',
              'site-jithr-site123.jpg': 'https://69d5145dace78.site123.me/',
              'site-lenora.jpg': 'https://madardigital.github.io/lenora-marketing-platform/',
              'site-arej.jpg': 'https://madardigital.github.io/Arej/',
              'site-adobe-express.jpg': 'https://new.express.adobe.com/webpage/vDW13GCUTqBz5',
          }

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  for filename, url in sites.items():
                      context = await browser.new_context(
                          viewport={'width': 1200, 'height': 900},
                          device_scale_factor=1,
                          locale='ar-SA'
                      )
                      page = await context.new_page()
                      try:
                          await page.goto(url, wait_until='domcontentloaded', timeout=90000)
                          await page.wait_for_timeout(6000)
                          await page.screenshot(
                              path=f'assets/{filename}',
                              type='jpeg',
                              quality=86,
                              full_page=False
                          )
                      finally:
                          await context.close()
                  await browser.close()

          asyncio.run(main())
          PY

      - name: Commit refreshed media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portfolio-project-atlas-v4.jpg assets/site-*.jpg
          if git diff --cached --quiet; then
            echo 'No media changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh portfolio atlas and website covers [skip ci]'
          git push
