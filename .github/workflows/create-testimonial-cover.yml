name: Create testimonial cover

on:
  push:
    paths:
      - '.github/workflows/create-testimonial-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build cover from strongest testimonial
        run: |
          python <<'PY'
          from PIL import Image, ImageFilter, ImageOps, ImageDraw
          src = Image.open('assets/portfolio-project-atlas-v4.jpg').convert('RGB')
          tile = src.crop((0, 12700, 800, 13800))
          bg = ImageOps.fit(tile, (1200, 900), method=Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(24))
          wash = Image.new('RGB', (1200, 900), (244, 240, 232))
          canvas = Image.blend(bg, wash, 0.68).convert('RGBA')
          target_h = 820
          target_w = round(tile.width * target_h / tile.height)
          main = tile.resize((target_w, target_h), Image.Resampling.LANCZOS).convert('RGBA')
          x = (1200 - target_w) // 2
          y = (900 - target_h) // 2
          shadow = Image.new('RGBA', (target_w + 40, target_h + 40), (0, 0, 0, 0))
          d = ImageDraw.Draw(shadow)
          d.rounded_rectangle((20, 20, target_w + 20, target_h + 20), radius=18, fill=(0, 0, 0, 55))
          shadow = shadow.filter(ImageFilter.GaussianBlur(12))
          canvas.alpha_composite(shadow, (x - 20, y - 20))
          canvas.alpha_composite(main, (x, y))
          canvas.convert('RGB').save('assets/testimonials-cover.jpg', quality=90, optimize=True)
          PY

      - name: Commit cover only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/testimonials-cover.jpg
          git commit -m 'Add testimonial screenshot cover' || exit 0
          git push
