name: Bust projects cache

on:
  push:
    paths:
      - '.github/workflows/bust-projects-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update projects script version only
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='js/projects.js?v=20260818-presentations-1'
          new='js/projects.js?v=20260818-sections-2'
          assert old in s, 'Expected projects cache token not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify
        run: grep -q 'js/projects.js?v=20260818-sections-2' index.html
      - name: Commit index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh project data cache token' || exit 0
          git push
